openapi: 3.1.0
info:
  title: AI Agent Orchestrator (Ollama)
  version: "1.0.0"
  description: |
    Production-grade AI Agent Orchestrator backend built with FastAPI and Ollama.
    Supports multi-agent orchestration, file ingestion for RAG, and workflow run tracking.

servers:
  - url: http://127.0.0.1:8000

paths:
  /health:
    get:
      summary: Health check
      description: Returns service status and key configuration values.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    ollama_model: deepseek-r1
                    embeddings_enabled: true
                    storage_backend: mongo

  /ask:
    post:
      summary: Process user message through AI Orchestrator
      description: |
        Routes a user request through the orchestrator pipeline
        (intent, retrieval, tools, safety) and returns the final response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: Successful AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"
              examples:
                example:
                  value:
                    run_id: "c3b8a4e1-2a9f-4b1e-b5c3-9b9d21a6d101"
                    answer: "Here is the final response generated by the AI agents."
        "400":
          description: Invalid input

  /files/upload:
    post:
      summary: Upload a PDF file
      description: Uploads and ingests a single PDF for retrieval-augmented generation.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"

  /files/upload-multiple:
    post:
      summary: Upload multiple PDF files
      description: Uploads and ingests multiple PDFs in one request.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Files uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadMultipleResponse"

  /runs:
    get:
      summary: List workflow runs
      description: Returns a list of recorded workflow runs.
      responses:
        "200":
          description: List of runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Run"

  /runs/{run_id}:
    get:
      summary: Get workflow run details
      description: Returns detailed information about a specific workflow run.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        ollama_model:
          type: string
        embeddings_enabled:
          type: boolean
        storage_backend:
          type: string

    AskRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
        user_id:
          type: string
          default: default

    AskResponse:
      type: object
      properties:
        run_id:
          type: string
        answer:
          type: string

    UploadResponse:
      type: object
      properties:
        ok:
          type: boolean
        file_id:
          type: string
        filename:
          type: string
        chunks:
          type: integer

    UploadMultipleResponse:
      type: object
      properties:
        ok:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/UploadResponse"
        errors:
          type: array
          items:
            type: object

    Run:
      type: object
      properties:
        run_id:
          type: string
        created_at:
          type: string
          format: date-time

    RunDetail:
      type: object
      properties:
        run_id:
          type: string
        steps:
          type: array
          items:
            type: object
            properties:
              agent:
                type: string
              output:
                type: string
